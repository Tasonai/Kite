name: Kite macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

jobs:
  build-release:
    name: Build macOS Release Artifacts
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
          fi

      - name: Build Kite.app
        run: |
          ./build.sh

      - name: Package Release DMG & ZIP
        run: |
          python3 tools/kite-cli build-dist --version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kite v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/Kite-${{ steps.ver.outputs.version }}-macOS.dmg
            dist/Kite-${{ steps.ver.outputs.version }}-macOS.zip
            dist/checksums.txt
          body: |
            ## Kite v${{ steps.ver.outputs.version }} (macOS)

            ### Release Artifacts
            - **DMG Installer:** `Kite-${{ steps.ver.outputs.version }}-macOS.dmg`
            - **ZIP Archive:** `Kite-${{ steps.ver.outputs.version }}-macOS.zip`
            - **Verification:** Checksums provided in `checksums.txt`

            ### Standards Compliance
            - 100% Apple Human Interface Guidelines (4pt/8pt grid)
            - 100% Zero Emojis (Native SF Symbols)
            - SwiftData Persistence with 110 automated tests
