name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true

      - name: Run Master Quality Gate
        run: |
          chmod +x tools/quality_gate.sh tools/grid-lint.sh tools/selftest.sh
          ./tools/quality_gate.sh
